# 本地开发环境一键起全（占位）
#
# 服务列表：
#   - mysql          核心数据库
#   - redis         缓存 + 限流
#   - etcd          分布式协调（Watch 热更 + 原子计数）
#   - kafka         异步任务解耦（KRaft 模式，不用 ZK）
#   - qdrant        语义缓存向量库
#   - otel-collector OTLP 接收
#   - jaeger        Trace 可视化
#   - prometheus    指标采集
#   - grafana       大盘展示
#
# Gateway / Worker / Console 不在这里跑，用 go run / python 直接起
# 端口占用（全部 6379 / 3306 / 2379 / 9092 / 6333 / 16686 / 9090 / 3000）

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_gateway
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  mysqldata:
