# Prometheus 抓取配置（阶段 7 落地）
#
# gateway metrics 暴露在 :8081/metrics（gateway.listen_metrics 配置），
# worker metrics 暴露在 :9091/metrics（占位，未来 Worker 落地后启用）。

scrape_configs:
  - job_name: ai-gateway
    scrape_interval: 15s
    static_configs:
      - targets: ["gateway:8081"]
        labels:
          service: ai-gateway

  - job_name: ai-worker
    scrape_interval: 30s
    static_configs:
      - targets: ["worker:9091"]
        labels:
          service: ai-worker

# 告警规则文件
rule_files:
  - "rules.yml"

